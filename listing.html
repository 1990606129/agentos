<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listing — eXp Realty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .pdp{padding:28px 0 90px}
  .gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:32px;height:460px}
  .gallery img{width:100%;height:100%;object-fit:cover;cursor:pointer;transition:opacity .15s}
  .gallery img:hover{opacity:.92}
  .gallery .main{grid-row:1/3}
  .pdp-grid{display:grid;grid-template-columns:1fr 360px;gap:40px;align-items:start}
  .pdp h1{font-family:'Space Grotesk';font-size:34px;font-weight:800;color:var(--navy);margin-bottom:6px}
  .pdp .sub{font-size:16px;color:var(--slate);margin-bottom:18px}
  .pdp-price{font-family:'Space Grotesk';font-size:34px;font-weight:800;color:var(--royal-bright)}
  .keyspecs{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:24px 0}
  .keyspecs div{flex:1;padding:18px 20px;border-right:1px solid var(--line)}
  .keyspecs div:last-child{border-right:none}
  .keyspecs b{font-family:'Space Grotesk';font-size:20px;font-weight:700;color:var(--navy);display:block}
  .keyspecs span{font-size:13px;color:var(--slate)}
  .pdp h3{font-family:'Space Grotesk';font-size:20px;font-weight:700;color:var(--navy);margin:32px 0 12px}
  .pdp p.desc{font-size:16px;color:var(--ink);line-height:1.7}
  .feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-top:8px}
  .feat-grid li{list-style:none;font-size:15px;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}
  .feat-grid li::before{content:'✓';color:var(--royal-bright);font-weight:700}
  .map{height:240px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);margin-top:8px}
  .map iframe{width:100%;height:100%;border:0}
  .side{position:sticky;top:92px;display:grid;gap:18px}
  .agent-card{border:1px solid var(--line);border-radius:var(--radius);padding:22px;background:#fff;box-shadow:var(--shadow-sm)}
  .agent-card .top{display:flex;gap:14px;align-items:center;margin-bottom:16px}
  .agent-card img{width:56px;height:56px;border-radius:50%;object-fit:cover}
  .agent-card b{font-family:'Space Grotesk';font-size:16px;color:var(--navy);display:block}
  .agent-card span{font-size:13px;color:var(--slate)}
  .offer-box{border:1px solid rgba(46,107,230,.25);background:#F4F8FF;border-radius:var(--radius);padding:20px}
  .offer-box .chip{display:inline-flex;align-items:center;gap:6px;font-family:'Space Grotesk';font-size:11px;font-weight:700;color:#fff;background:var(--royal-bright);padding:4px 10px;border-radius:99px;margin-bottom:12px}
  .offer-box h4{font-family:'Space Grotesk';font-size:17px;color:var(--navy);margin-bottom:6px}
  .offer-box .range{font-family:'Space Grotesk';font-size:24px;font-weight:800;color:var(--navy);margin:8px 0}
  .offer-box .meta{font-size:13px;color:var(--slate);margin-bottom:14px}
  @media(max-width:900px){.gallery{grid-template-columns:1fr 1fr;height:auto}.gallery .main{grid-row:auto;grid-column:1/3;height:280px}.pdp-grid{grid-template-columns:1fr}.side{position:static}}

  @media(max-width:640px){
    .pdp{padding:16px 0 64px}
    .gallery{height:auto;grid-template-columns:1fr 1fr;grid-template-rows:none;grid-auto-rows:min-content;gap:6px}
    .gallery .main{grid-row:auto;grid-column:1/3;height:230px}
    .gallery img:not(.main){height:104px}
    .pdp h1{font-size:27px}
    .keyspecs b{font-size:16px}
    .keyspecs div{padding:12px 10px}
    .map{height:200px}
  }
</style>
</head>
<body>
<div id="site-nav"></div>
<div class="pdp"><div class="wrap" id="pdp"></div></div>
<div id="site-footer"></div>

<script src="./data.js"></script>
<script src="./db.js"></script>
<script src="./app.js"></script>
<script>
  App.initChrome("buy");
  const id = App.qs("id");
  const l = DB.listing(id);
  const root = document.getElementById("pdp");
  if (!l) {
    root.innerHTML = '<div class="empty"><div class="ico">🏚️</div><h3 style="color:var(--navy)">Listing not found</h3><p><a href="listings.html" style="color:var(--royal-bright)">Back to all listings</a></p></div>';
  } else {
    document.title = `${l.address}, ${l.city} — eXp Realty`;
    const agent = DB.agent(l.agent);
    const user = DB.currentUser();
    const low = Math.round(l.price * 0.985 / 1000) * 1000;
    const high = Math.round(l.price * 1.02 / 1000) * 1000;
    const photos = l.photos.concat(l.photos).slice(0, 5);
    root.innerHTML = `
      <div class="breadcrumb"><a href="index.html">Home</a> / <a href="listings.html">Listings</a> / ${l.city}</div>
      <div class="gallery">
        <img class="main" src="${photos[0]}" alt="">
        <img src="${photos[1]}" alt=""><img src="${photos[2]}" alt="">
        <img src="${photos[3]}" alt=""><img src="${photos[4]}" alt="">
      </div>
      <div class="pdp-grid">
        <div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
            <div>
              <h1>${App.fmtPrice(l.price)}</h1>
              <div class="sub">${l.address}, ${l.city}, ${l.state} ${l.zip}</div>
            </div>
            <button class="btn btn-ghost" id="savebtn" onclick="saveHome()">♥ Save</button>
          </div>
          <div class="keyspecs">
            ${l.beds > 0 ? `<div><b>${l.beds}</b><span>Bedrooms</span></div>
            <div><b>${l.baths}</b><span>Bathrooms</span></div>
            <div><b>${l.sqft.toLocaleString()}</b><span>Sq ft</span></div>
            <div><b>${l.type}</b><span>${l.lot}</span></div>
            <div><b>${l.year}</b><span>Year built</span></div>`
            : `<div><b>${l.lot}</b><span>Acreage</span></div>
            ${l.sqft > 0 ? `<div><b>${l.sqft.toLocaleString()}</b><span>Building sq ft</span></div>` : ``}
            <div><b>${l.type}</b><span>Property type</span></div>
            ${l.year > 0 ? `<div><b>${l.year}</b><span>Year built</span></div>` : ``}`}
          </div>
          <h3>About this home</h3>
          <p class="desc">${l.desc}</p>
          <h3>Features</h3>
          <ul class="feat-grid">${l.features.map(f => `<li>${f}</li>`).join("")}</ul>
          <h3>Location</h3>
          <div class="map"><iframe loading="lazy" src="https://maps.google.com/maps?q=${l.lat},${l.lng}&z=14&output=embed"></iframe></div>
        </div>
        <aside class="side">
          <div class="offer-box">
            <span class="chip">⚡ AGENT OS</span>
            <h4>Smart offer guidance</h4>
            <div class="meta">Based on 14 comps within 0.5 mi</div>
            <div class="range">${App.fmtPriceShort(low)}–${App.fmtPriceShort(high)}</div>
            <div class="meta">Suggested opening offer with a 21-day close.</div>
            <button class="btn btn-royal btn-block" onclick="alert('Demo: AGENT OS would draft an offer package and route it to your agent for review.')">Draft an offer</button>
          </div>
          ${agent ? `<div class="agent-card">
            <div class="top">
              <img src="${agent.photo}" alt="${agent.name}">
              <div><b>${agent.name}</b><span>${agent.title} · ${agent.market}</span></div>
            </div>
            <div style="display:grid;gap:8px">
              <a class="btn btn-navy btn-block" href="tel:${agent.phone.replace(/[^0-9]/g,'')}">Call ${agent.phone}</a>
              <a class="btn btn-ghost btn-block" href="agent.html?id=${agent.id}">View profile</a>
              <button class="btn btn-ghost btn-block" onclick="alert('Demo: this would request a private showing this weekend.')">Request a tour</button>
            </div>
          </div>` : ""}
        </aside>
      </div>
      <h3 style="font-family:'Space Grotesk';font-size:22px;color:var(--navy);margin:60px 0 22px">More homes in ${l.city}</h3>
      <div class="cards" id="more"></div>`;

    document.getElementById("more").innerHTML =
      DB.listings({ city: l.city }).filter(x => x.id !== l.id).slice(0, 3).map(x => App.listingCard(x)).join("")
      || DB.listings().filter(x => x.id !== l.id).slice(0, 3).map(x => App.listingCard(x)).join("");

    // Save state
    const savebtn = document.getElementById("savebtn");
    if (user && DB.isFavorite(user.id, l.id)) { savebtn.classList.add("active"); savebtn.innerHTML = "♥ Saved"; }
    window.saveHome = () => {
      if (!user) { location.href = "login.html?next=listing.html?id=" + l.id; return; }
      const on = DB.toggleFavorite(user.id, l.id);
      savebtn.innerHTML = on ? "♥ Saved" : "♥ Save";
      savebtn.style.color = on ? "#E5484D" : "";
    };
  }
</script>
</body>
</html>
