<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — eXp Realty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
<div id="site-nav"></div>
<div class="wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your AGENT OS workspace.</p>
    <div class="demo-tip">🔑 <b>Demo login</b> — email <b>demo@exp.demo</b>, password <b>demo1234</b>. Or create a new account; it's stored locally in your browser.</div>
    <div id="alert"></div>
    <form id="form" onsubmit="return doLogin(event)">
      <div class="field"><label>Email</label><input type="email" id="email" value="demo@exp.demo" required></div>
      <div class="field"><label>Password</label><input type="password" id="password" value="demo1234" required></div>
      <button class="btn btn-navy btn-block btn-lg" type="submit">Log in</button>
    </form>
    <div class="auth-alt">New here? <a href="signup.html">Create an account</a></div>
  </div>
</div>
<div id="site-footer"></div>
<script src="./data.js?v=7"></script>
<script src="./db.js?v=7"></script>
<script src="./app.js?v=7"></script>
<script src="./auth.js?v=7"></script>
<script>
  App.initChrome("");
  function doLogin(e){
    e.preventDefault();
    const r = DB.login(document.getElementById("email").value, document.getElementById("password").value);
    const al = document.getElementById("alert");
    if(!r.ok){ al.innerHTML = `<div class="notice err">${r.error}</div>`; return false; }
    location.href = Auth.nextUrl() || "dashboard.html";
    return false;
  }
</script>
</body>
</html>
