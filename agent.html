<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent — eXp Realty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=10">
<style>
  .profile{padding:40px 0 90px}
  .p-top{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;padding-bottom:32px;border-bottom:1px solid var(--line);margin-bottom:36px}
  .p-top img{width:120px;height:120px;border-radius:24px;object-fit:cover;box-shadow:var(--shadow-sm)}
  .p-top h1{font-family:'Space Grotesk';font-size:32px;font-weight:800;color:var(--navy);margin-bottom:4px}
  .p-top .role{font-size:15px;color:var(--royal-bright);font-weight:600}
  .p-top .mkt{font-size:14px;color:var(--slate);margin-top:2px}
  .p-actions{display:grid;gap:10px;min-width:200px}
  .p-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px}
  .p-stat{border:1px solid var(--line);border-radius:var(--radius);padding:20px;text-align:center}
  .p-stat b{font-family:'Space Grotesk';font-size:24px;color:var(--navy);display:block}
  .p-stat span{font-size:12.5px;color:var(--slate)}
  .profile h3{font-family:'Space Grotesk';font-size:20px;color:var(--navy);margin:0 0 14px}
  .profile p.bio{font-size:16px;color:var(--ink);line-height:1.7;max-width:780px;margin-bottom:18px}
  .socials-inline{display:flex;gap:10px;margin-bottom:40px}
  .socials-inline a{width:40px;height:40px;border-radius:10px;background:var(--bg-soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);font-size:13px;transition:all .15s}
  .socials-inline a:hover{background:var(--navy);color:#fff}
  @media(max-width:760px){.p-top{grid-template-columns:1fr;text-align:center;justify-items:center}.p-actions{width:100%}.p-stats{grid-template-columns:1fr 1fr}}

  @media(max-width:640px){
    .profile{padding:24px 0 64px}
    .p-top img{width:96px;height:96px}
    .p-top h1{font-size:26px}
    .p-stats{gap:10px}
    .p-stat{padding:14px}
    .p-stat b{font-size:19px}
  }
</style>
</head>
<body>
<div id="site-nav"></div>
<div class="profile"><div class="wrap" id="profile"></div></div>
<div id="site-footer"></div>
<script src="./data.js?v=10"></script>
<script src="./db.js?v=10"></script>
<script src="./app.js?v=10"></script>
<script>
  App.initChrome("agents");
  const a = DB.agent(App.qs("id"));
  const root = document.getElementById("profile");
  if(!a){
    root.innerHTML = '<div class="empty"><div class="ico"><svg class="i" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8.5" r="3.8"/><path d="M5 19.5c.8-3.6 3.4-5.5 7-5.5s6.2 1.9 7 5.5"/></svg></div><h3 style="color:var(--navy)">Agent not found</h3><p><a href="agents.html" style="color:var(--royal-bright)">Back to all agents</a></p></div>';
  } else {
    document.title = a.name + " — eXp Realty";
    const listings = DB.agentListings(a.id);
    root.innerHTML = `
      <div class="breadcrumb"><a href="index.html">Home</a> / <a href="agents.html">Agents</a> / ${a.name}</div>
      <div class="p-top">
        <img src="${a.photo}" alt="${a.name}">
        <div>
          <h1>${a.name}</h1>
          <div class="role">${a.title}</div>
          <div class="mkt">${a.market} · ${a.years} years · Speaks ${a.langs.join(", ")}</div>
        </div>
        <div class="p-actions">
          <a class="btn btn-navy btn-block" href="tel:${a.phone.replace(/[^0-9]/g,'')}">Call ${a.phone}</a>
          <a class="btn btn-ghost btn-block" href="mailto:${a.email}">Email agent</a>
          <button class="btn btn-royal btn-block" onclick="alert('Demo: this would open a referral agreement in the Global Referral Platform.')">Send a referral</button>
        </div>
      </div>
      <div class="p-stats">
        <div class="p-stat"><b>${a.sales}</b><span>Homes sold</span></div>
        <div class="p-stat"><b>${a.volume}</b><span>Sales volume</span></div>
        <div class="p-stat"><b>${a.rating}★</b><span>Client rating</span></div>
        <div class="p-stat"><b>${a.years}</b><span>Years experience</span></div>
      </div>
      <h3>About ${a.name.split(" ")[0]}</h3>
      <p class="bio">${a.bio}</p>
      <div class="socials-inline">
        <a href="${a.socials.instagram}" title="Instagram">IG</a>
        <a href="${a.socials.linkedin}" title="LinkedIn">in</a>
        <a href="${a.socials.x}" title="X">X</a>
      </div>
      <h3>${a.name.split(" ")[0]}'s listings</h3>
      <div class="cards" style="margin-top:14px">${listings.length ? listings.map(l=>App.listingCard(l)).join("") : '<p class="muted">No active listings right now.</p>'}</div>`;
  }
</script>
</body>
</html>
